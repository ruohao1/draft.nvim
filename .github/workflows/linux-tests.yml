name: Linux tests

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      codex_runtime:
        description: "Run the pinned Codex audit with a local synthetic provider"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Provider-free suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl apparmor bison bubblewrap build-essential git \
            libcap-dev libevent-dev libncurses-dev libselinux1-dev \
            meson ninja-build pkg-config python3 ripgrep

      - name: Install Bubblewrap 0.11.1
        run: |
          archive="$RUNNER_TEMP/bubblewrap-0.11.1.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71 \
            "$archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bubblewrap-0.11.1"
          meson setup build --prefix=/usr -Dman=disabled -Dtests=false \
            -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C build
          sudo install --mode=0755 build/bwrap /usr/bin/bwrap

      - name: Allow Bubblewrap namespaces on the disposable runner
        run: |
          # Ubuntu restricts unprivileged user namespaces unless an executable
          # has an AppArmor profile allowing them. Keep the global restriction.
          sudo tee /etc/apparmor.d/draft-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile draft-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/draft-ci-bwrap

      - name: Install tmux 3.7c
        run: |
          archive="$RUNNER_TEMP/tmux-3.7c.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.7c"
          ./configure --prefix=/usr
          make --jobs=2
          # Nested fixtures deliberately restrict PATH to system directories.
          sudo install --mode=0755 tmux /usr/bin/tmux

      - name: Install Neovim 0.12.4
        run: |
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628 \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Report versions and verify namespaces
        run: |
          nvim --version
          /usr/bin/python3 --version
          git --version
          bwrap --version
          tmux -V
          rg --version
          setfacl --version
          if ! bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev -- /bin/true; then
            sysctl kernel.apparmor_restrict_unprivileged_userns || true
            cat /proc/self/attr/current || true
            sudo rg --line-number 'bwrap|userns' /etc/apparmor.d \
              /sys/kernel/security/apparmor/profiles || true
            sudo journalctl --dmesg --no-pager --grep='apparmor' --lines=20 || true
            exit 1
          fi

      - name: Run every provider-free suite
        run: /usr/bin/python3 -I -B tests/run.py

      - name: Prepare pinned Codex for the optional runtime audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.codex_runtime }}
        run: |
          archive="$RUNNER_TEMP/codex-package-0.163.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-package-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            582646c6bf0561eb0de540f7fc85b9121b0091a826bc6e96830b7f1722122182 \
            "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/draft-codex"
          tar --extract --gzip --file "$archive" --no-same-owner --no-same-permissions \
            --directory "$RUNNER_TEMP/draft-codex" bin/codex bin/codex-code-mode-host
          echo "DRAFT_TEST_CODEX_PATH=$RUNNER_TEMP/draft-codex/bin/codex" >> "$GITHUB_ENV"

      - name: Run the optional Codex runtime audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.codex_runtime }}
        run: /usr/bin/python3 -I -B tests/run.py --codex "$DRAFT_TEST_CODEX_PATH" nvim_ai_codex_runtime nvim_ai_codex_auth_runtime

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-logs
          path: .test-results/run-*/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
